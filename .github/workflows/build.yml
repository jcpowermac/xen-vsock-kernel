# Manual dispatch only: a build is a ~1-2 h, 2-vCPU kernel compile.
# Re-trigger when Fedora ships a newer F44 kernel (bump V/R in build.sh first).
name: build
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # The kernel build tree needs ~15 GB; the stock runner image wastes ~10.
      - uses: easimon/maximize-build-space@v1
      - id: build
        uses: ./
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms/
      # Consumers (blue-build `dnf` modules in the os recipes) install these
      # by release-asset URL, so the release IS the distribution channel.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ needs.build.outputs.kernel-version }}
          name: kernel-${{ needs.build.outputs.kernel-version }}
          body: |
            Fedora 44 kernel 7.2.8 with `CONFIG_XEN_VSOCKETS=y` (and
            `CONFIG_VSOCKETS=y`). Built from the official F44 src.rpm; release
            bumped 200 -> 201 so it sorts after and coexists with the stock
            kernel. Unsigned (self-hosted for our own image builds).
          files: rpms/*.rpm
          fail_on_unmatched_files: true

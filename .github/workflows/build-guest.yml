# Manual dispatch. Builds the minimal Xen guest kernel: fetches whatever
# kernel the Fedora 44 repo currently serves, applies the minimalization
# script (strips ~70% of modules), bumps release +1, compiles x86-64-v4.
# New kernel from Fedora = re-dispatch.
name: build-guest
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        required: false
        default: "self-hosted"
        type: choice
        options: ["self-hosted", "ubuntu-latest"]
      build_deps:
        description: "Bump to force-refresh the cached builder stage"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    outputs:
      kver: ${{ steps.image.outputs.kernel-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: runner.environment == 'github'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/NuGet /opt/powershell
          sudo apt-get -y clean
          df -h /
      - uses: docker/setup-buildx-action@v3
        if: runner.environment == 'github'
      - id: image
        run: |
          DOCKER=$(command -v docker || command -v podman) \
            || { echo "need docker or podman"; exit 1; }
          if [ "${{ runner.environment }}" = "github" ]; then
            docker buildx build \
              --build-arg BUILD_DEPS="${{ github.event.inputs.build_deps }}" \
              --build-arg FORCE_REFRESH="${{ github.run_id }}" \
              --cache-from type=gha,cacheonly=1 \
              --cache-to type=gha,mode=max \
              --load -t xen-guest-kernel:local -f Dockerfile.guest .
          else
            "$DOCKER" build -t xen-guest-kernel:local -f Dockerfile.guest .
          fi
          "$DOCKER" create --name kv xen-guest-kernel:local
          mkdir -p out
          "$DOCKER" cp kv:/out/. out/
          "$DOCKER" rm kv
          echo "kernel-version=$(cat out/kernel_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rpms-guest
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms-guest
          path: rpms/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-xenguest-${{ needs.build.outputs.kver }}
          name: kernel-xenguest-${{ needs.build.outputs.kver }}
          body: |
            Minimal Fedora 44 kernel for Xen PV/PVH guest VMs only.
            Stripped of ~86% of modules (sound, USB, GPU, storage controllers,
            wireless, input, non-Xen hypervisors, NETFILTER, Ethernet PHY,
            thermal, NVMe, IIO). Built from the official F44 src.rpm with
            the release bumped +1. x86-64-v4 ISA target.

            **PV drivers**: xen-blkfront, xen-netfront, xen console frontend
            (all built-in for initramfs).

            **Root filesystem**: XFS with ostree deployment.
            Generate initramfs with `dracut -f --add ostree`.

            Unsigned (consumed only by our own image builds).
          files: rpms/*.rpm
          fail_on_unmatched_files: true

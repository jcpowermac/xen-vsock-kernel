# Manual dispatch only: a build is a ~1-2 h, 2-vCPU kernel compile.
# The `kernel` input is the STOCK Fedora NEVR to base the build on (V-R);
# our build comes out as V-(R+1). When Fedora ships a new F44 kernel,
# dispatch with the new stock version — no commit needed.
name: build
on:
  workflow_dispatch:
    inputs:
      kernel:
        description: "Stock kernel version-release to base the build on"
        required: false
        default: "7.2.8-200"
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      kver: ${{ steps.build.outputs.kernel-version }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to ghcr (toolchain image)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The kernel build needs ~16 GB; the stock runner image wastes ~19 on
      # dotnet + android. (easimon/maximize-build-space is broken on current
      # runner images: its temp-disk step exits 32 on `umount /mnt`.)
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/NuGet /opt/powershell
          sudo apt-get -y clean
          df -h /
      - id: build
        run: bash build.sh
        env:
          KVER_INPUT: ${{ github.event.inputs.kernel }}
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms/
      # Consumers (blue-build `dnf` modules in the os recipes) install these
      # by release-asset URL, so the release IS the distribution channel.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ needs.build.outputs.kver }}
          name: kernel-${{ needs.build.outputs.kver }}
          body: |
            Fedora 44 kernel with `CONFIG_XEN_VSOCKETS=y` (and
            `CONFIG_VSOCKETS=y`). Built from the official F44 src.rpm with
            the release bumped +1 so it sorts after and coexists with the
            stock kernel. Unsigned (consumed only by our own image builds).
          files: rpms/*.rpm
          fail_on_unmatched_files: true

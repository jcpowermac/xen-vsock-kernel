# Manual dispatch only. The Dockerfile IS the build: it fetches whatever
# kernel the Fedora 44 repo currently serves (no pinning), patches the two
# vsock config lines, bumps the release +1, and compiles. New kernel from
# Fedora = re-dispatch (rebuild the container).
name: build
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      kver: ${{ steps.image.outputs.kernel-version }}
    steps:
      - uses: actions/checkout@v4
      # The kernel build tree needs ~15 GB; the stock runner image wastes ~19
      # on dotnet + android.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/NuGet /opt/powershell
          sudo apt-get -y clean
          df -h /
      - id: image
        run: |
          docker build -t xen-vsock-kernel:local .
          docker create --name kv xen-vsock-kernel:local
          mkdir -p out
          docker cp kv:/out/. out/
          docker rm kv
          echo "kernel-version=$(cat out/kernel_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms/
      # Consumers (blue-build `dnf` modules in the os recipes) install these
      # by release-asset URL, so the release IS the distribution channel.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ needs.build.outputs.kver }}
          name: kernel-${{ needs.build.outputs.kver }}
          body: |
            Fedora 44 kernel with `CONFIG_XEN_VSOCKETS=y` (and
            `CONFIG_VSOCKETS=y`). Built from the official F44 src.rpm with
            the release bumped +1 so it sorts after and coexists with the
            stock kernel. Unsigned (consumed only by our own image builds).
          files: rpms/*.rpm
          fail_on_unmatched_files: true

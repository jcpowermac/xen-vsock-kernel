# Manual dispatch. The Dockerfile IS the build: it fetches whatever kernel
# the Fedora 44 repo currently serves (no pinning), patches the two vsock
# config lines, bumps the release +1, and compiles an x86-64-v4 kernel.
# New kernel from Fedora = re-dispatch.
#
# Runner: `self-hosted` (default; fast local box, plain build, no cache
# needed) or `ubuntu-latest` (2 vCPU, buildx + GHA layer cache — the
# `builder` stage's package pulls are cached across runs).
name: build
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        required: false
        default: "self-hosted"
        type: choice
        options: ["self-hosted", "ubuntu-latest"]
      build_deps:
        description: "Bump to force-refresh the cached builder stage (new kernel needs new build deps)"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    outputs:
      kver: ${{ steps.image.outputs.kernel-version }}
    steps:
      - uses: actions/checkout@v4
      # GitHub-hosted runners only: the kernel build tree needs ~15 GB and
      # the stock runner image wastes ~19 on dotnet + android.
      - name: Free disk space
        if: runner.environment == 'github'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/share/NuGet /opt/powershell
          sudo apt-get -y clean
          df -h /
      - uses: docker/setup-buildx-action@v3
        if: runner.environment == 'github'
      - id: image
        run: |
          DOCKER=$(command -v docker || command -v podman) \
            || { echo "need docker or podman"; exit 1; }
          if [ "${{ runner.environment }}" = "github" ]; then
            docker buildx build \
              --build-arg BUILD_DEPS="${{ github.event.inputs.build_deps }}" \
              --build-arg FORCE_REFRESH="${{ github.run_id }}" \
              --cache-from type=gha,cacheonly=1 \
              --cache-to type=gha,mode=max \
              --load -t xen-vsock-kernel:local .
          else
            "$DOCKER" build -t xen-vsock-kernel:local .
          fi
          "$DOCKER" create --name kv xen-vsock-kernel:local
          mkdir -p out
          "$DOCKER" cp kv:/out/. out/
          "$DOCKER" rm kv
          echo "kernel-version=$(cat out/kernel_version.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: out/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: rpms/
      # Consumers (blue-build `dnf` modules in the os recipes) install these
      # by release-asset URL, so the release IS the distribution channel.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-${{ needs.build.outputs.kver }}
          name: kernel-${{ needs.build.outputs.kver }}
          body: |
            Fedora 44 kernel with `CONFIG_XEN_VSOCKETS=y` (and
            `CONFIG_VSOCKETS=y`), compiled for x86-64-v4. Built from the
            official F44 src.rpm with the release bumped +1 so it sorts
            after and coexists with the stock kernel. Unsigned (consumed
            only by our own image builds).
          files: rpms/*.rpm
          fail_on_unmatched_files: true

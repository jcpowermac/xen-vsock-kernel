# Builds the kernel toolchain image and pushes it to ghcr, so `build.yml`
# pulls a ready image instead of re-installing the toolchain every run.
# Runs on Dockerfile changes, or on demand.
name: build-image
on:
  workflow_dispatch: {}
  push:
    paths:
      - Dockerfile

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMG=ghcr.io/jcpowermac/xen-vsock-kernel-build
          docker build -t "$IMG:latest" -t "$IMG:${GITHUB_SHA::12}" .
          docker push "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::12}"
          echo "pushed $IMG:latest"
